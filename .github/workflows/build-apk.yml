name: Compila APK MAIR GO!

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa Capacitor
        run: npm install

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Installa il selettore backup nativo
        run: |
          mkdir -p android/app/src/main/java/info/dandreart/mairgo
          cp native/android/MairBackupPlugin.java android/app/src/main/java/info/dandreart/mairgo/MairBackupPlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/info/dandreart/mairgo/MainActivity.java

      - name: Sincronizza i file dell'app
        run: npx cap sync android

      - name: Ricrea il keystore dalle chiavi segrete
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mair-release.keystore
          ls -la android/app/mair-release.keystore

      - name: Firma con la chiave fissa (aggiornamenti senza disinstallare)
        run: |
          python3 - << 'PYSIGN'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          sign='''
              signingConfigs {
                  fissa {
                      storeFile file('mair-release.keystore')
                      storePassword System.getenv('MAIR_STORE_PW')
                      keyAlias System.getenv('MAIR_KEY_ALIAS')
                      keyPassword System.getenv('MAIR_KEY_PW')
                  }
              }'''
          s=re.sub(r'android\s*\{', 'android {'+sign, s, count=1)
          if re.search(r'buildTypes\s*\{', s):
              s=re.sub(r'buildTypes\s*\{', 'buildTypes {\n        debug { signingConfig signingConfigs.fissa }', s, count=1)
          else:
              s=re.sub(r'(signingConfigs\s*\{[^}]*\}\s*\})', r'\1\n    buildTypes { debug { signingConfig signingConfigs.fissa } }', s, count=1)
          open(p,'w').write(s)
          print('--- build.gradle firmato ---')
          i=s.find('android'); print(s[i:i+500])
          PYSIGN

      - name: Compila l'APK
        env:
          MAIR_STORE_PW: ${{ secrets.MAIR_KEYSTORE_PASSWORD }}
          MAIR_KEY_ALIAS: ${{ secrets.MAIR_KEY_ALIAS }}
          MAIR_KEY_PW: ${{ secrets.MAIR_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Pubblica l'APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: MAIR-GO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
